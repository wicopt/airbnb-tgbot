# docker-compose.yml
services:
  rabbitmq:
      image: rabbitmq:3-management-alpine
      container_name: rabbitmq
      ports:
        - "5672:5672"   # AMQP протокол
        - "15672:15672" # Веб-интерфейс управления
      environment:
        - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER}
        - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS}
      volumes:
        - rabbitmq_data:/var/lib/rabbitmqcohesive
      healthcheck:
        test: ["CMD", "rabbitmq-diagnostics", "ping"]
        interval: 10s
        timeout: 5s
        retries: 5
      networks:
      - internal
  
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_DB: ${DB_DATABASE}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d  # Путь исправлен
    networks:
      - internal  

  pg-backup:
    image: ghcr.io/wicopt/airbnb-tgbot/pg-backup:latest
    container_name: pg-backup
    environment:
      PGHOST: db
      PGUSER: ${DB_USER}
      PGPASSWORD: ${DB_PASSWORD}
      PGDATABASE: ${DB_DATABASE}
      RCLONE_REMOTE: gdrive:pg-backups/airbnb-tgbot
      RETENTION_DAYS: 14
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backup/rclone-config:/root/.config/rclone
      - backup_data:/backups
    labels: 
      ofelia.enabled: "true" 
      ofelia.job-exec.pg-dump.schedule: "0 0 3 * * *" 
      ofelia.job-exec.pg-dump.command: "/backup.sh"
    networks:
      - internal
      - public
  ofelia: 
    image: mcuadros/ofelia:latest 
    container_name: ofelia 
    command: daemon --docker 
    depends_on: 
      - pg-backup 
    volumes: 
      - /var/run/docker.sock:/var/run/docker.sock:ro 
    networks: 
      - internal 
  gmail-service:
    image: ghcr.io//wicopt/airbnb-tgbot/gmail-service:latest
    container_name: gmail-service
    environment:
      DATABASE_URL: ${DATABASE_URL}
      RABBITMQ_URL: ${RABBITMQ_URL}
      REDIRECT_URI: ${REDIRECT_URI}
    depends_on:
      rabbitmq:
        condition: service_healthy
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - internal
      - public
  payment-service:
    image: ghcr.io/wicopt/airbnb-tgbot/payment-service:latest
    container_name: payment-service
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      RABBITMQ_URL: ${RABBITMQ_URL}
    depends_on:
      rabbitmq:
        condition: service_healthy
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - internal
      - public
  auth-service:
    image: ghcr.io/wicopt/airbnb-tgbot/auth-service:latest
    container_name: auth-service
    environment:
      DATABASE_URL: ${DATABASE_URL}
      RABBITMQ_URL: ${RABBITMQ_URL}
    depends_on:
      rabbitmq:
        condition: service_healthy
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - internal
  tg-service:
    image: ghcr.io/wicopt/airbnb-tgbot/tg-service:latest
    container_name: tg-service
    environment:
      DATABASE_URL: ${DATABASE_URL}
      RABBITMQ_URL: ${RABBITMQ_URL}
      BACKEND_URL: ${BACKEND_URL}
      BOT_TOKEN: ${BOT_TOKEN}
    depends_on:
      rabbitmq:
        condition: service_healthy
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - internal
      - public
networks:
  internal:
    driver: bridge
    internal: true  
  public: 
    driver: bridge

volumes:
  postgres_data:  
  rabbitmq_data:
  backup_data: