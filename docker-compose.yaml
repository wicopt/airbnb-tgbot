# docker-compose.yml
services:
  rabbitmq:
      image: rabbitmq:3-management-alpine
      container_name: rabbitmq
      environment:
        - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER}
        - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS}
      volumes:
        - rabbitmq_data:/var/lib/rabbitmq
      healthcheck:
        test: ["CMD", "rabbitmq-diagnostics", "ping"]
        interval: 10s
        timeout: 5s
        retries: 5
      networks:
      - internal 
  
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_DB: ${DB_DATABASE}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d  
    networks:
      - internal  

  pg-backup:
    build: ./backup
    container_name: pg-backup
    environment:
      PGHOST: db
      PGUSER: ${DB_USER}
      PGPASSWORD: ${DB_PASSWORD}
      PGDATABASE: ${DB_DATABASE}
      RCLONE_REMOTE: gdrive:pg-backups/airbnb-tgbot
      RETENTION_DAYS: 14
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backup/rclone-config:/root/.config/rclone
      - backup_data:/backups
    labels: 
      ofelia.enabled: "true" 
      ofelia.job-exec.pg-dump.schedule: "0 0 3 * * *" 
      ofelia.job-exec.pg-dump.command: "/backup.sh"
    networks:
      - internal
      - public

  gmail-service:
    build: ./gmail-service 
    container_name: gmail-service
    environment:
      DATABASE_URL: ${DATABASE_URL}
      RABBITMQ_URL: ${RABBITMQ_URL}
      REDIRECT_URI: ${REDIRECT_URI}
    depends_on:
      rabbitmq:
        condition: service_healthy
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - internal
      - public
  payment-service:
    build: ./payment-service 
    container_name: payment-service
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      RABBITMQ_URL: ${RABBITMQ_URL}
    depends_on:
      rabbitmq:
        condition: service_healthy
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - internal
      - public
  auth-service:
    build: ./auth-service
    container_name: auth-service
    environment:
      DATABASE_URL: ${DATABASE_URL}
      RABBITMQ_URL: ${RABBITMQ_URL}
    depends_on:
      rabbitmq:
        condition: service_healthy
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - internal
  tg-service:
    build: ./telegram-bot
    container_name: tg-service
    environment:
      DATABASE_URL: ${DATABASE_URL}
      RABBITMQ_URL: ${RABBITMQ_URL}
      BACKEND_URL: ${BACKEND_URL}
      BOT_TOKEN: ${BOT_TOKEN}
    depends_on:
      rabbitmq:
        condition: service_healthy
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - internal
      - public
networks:
  internal:
    driver: bridge
    internal: true  
  public: 
    driver: bridge

volumes:
  postgres_data:  
  rabbitmq_data:
  backup_data: